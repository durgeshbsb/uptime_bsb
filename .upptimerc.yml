status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  # cname: demo.upptime.js.org
  baseUrl: /uptime_bsb
  # logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  logoUrl: https://bsbfortrade.com/assets/images/Logo_bsb_white.webp
  name: BSB
  theme: ocean
  introTitle: "**BSB Service Status**"
  introMessage: >
    Monitor the real-time availability and performance of BSB websites,
    applications, APIs, and customer services. This page is updated
    automatically to provide current operational status and incident history.
  navbar:
    - title: Status
      href: /uptime_bsb
    # - title: GitHub
      # href: https://github.com/$OWNER/$REPO
